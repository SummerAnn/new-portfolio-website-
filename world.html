<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini World — Summer Ann</title>
    <link rel="icon" type="image/png" href="./assets/icons/7.png" />
    <script>
      (function(){var t=localStorage.getItem('theme');if(!t)t='light';document.documentElement.dataset.theme=t})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
    <script type="module" src="./diorama.js" defer></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .world-nav {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 24px;
        background: var(--bg); border-bottom: 1px solid var(--rule);
      }
      .world-nav a, .world-nav button {
        font-family: var(--font-mono);
        font-size: var(--text-micro-sm);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg);
        opacity: 0.5;
        transition: opacity 0.2s ease;
        text-decoration: none;
      }
      .world-nav a:hover, .world-nav button:hover { opacity: 1; }
      .world-nav__title {
        font-family: var(--font-mono);
        font-size: var(--text-micro-sm);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg); opacity: 0.7;
      }
      .world-nav__right { display: flex; gap: 16px; align-items: center; }
      .diorama-section {
        display: block !important;
        position: fixed; inset: 0;
        padding: 0; margin: 0; max-width: none;
      }
      .diorama-container {
        height: 100vh !important;
        max-height: none !important;
      }
      .diorama-controls, .diorama-zoom, .diorama-nav {
        opacity: 1 !important; pointer-events: auto !important;
      }
      .diorama-zoom { top: 60px !important; }
      .diorama-nav { top: 60px !important; }
    </style>
  </head>
  <body>
    <nav class="world-nav">
      <a href="./index.html">&larr; Back</a>
      <span class="world-nav__title">Mini World</span>
      <div class="world-nav__right">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
          <svg class="theme-toggle__bulb" width="18" height="24" viewBox="-3 -4 22 28" fill="none">
            <path class="bulb-glass" d="M8 1C4.7 1 2 3.7 2 7c0 2 1 3.8 2.5 4.9V14c0 .6.4 1 1 1h5c.6 0 1-.4 1-1v-2.1C13 10.8 14 9 14 7c0-3.3-2.7-6-6-6z" stroke="currentColor" stroke-width="1.3"/>
            <line x1="4.5" y1="16.5" x2="11.5" y2="16.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="5.5" y1="18.5" x2="10.5" y2="18.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <g class="bulb-rays" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
              <line x1="8" y1="-1" x2="8" y2="-3"/>
              <line x1="14.5" y1="1.5" x2="16" y2="0"/>
              <line x1="1.5" y1="1.5" x2="0" y2="0"/>
              <line x1="16" y1="7" x2="18" y2="7"/>
              <line x1="0" y1="7" x2="-2" y2="7"/>
            </g>
          </svg>
        </button>
      </div>
    </nav>

    <section class="diorama-section" id="diorama" style="position:relative;">
      <div class="diorama-container" id="dioramaContainer">
        <div class="diorama-loading" id="dioramaLoading">
          <span class="diorama-loading__text">Loading scene</span>
        </div>
        <canvas id="dioramaCanvas"></canvas>
        <div id="bubbleOverlay" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;"></div>
        <div class="diorama-zoom visible">
          <button class="diorama-btn" id="zoomIn" type="button" title="Zoom in">+</button>
          <button class="diorama-btn" id="zoomOut" type="button" title="Zoom out">-</button>
        </div>
        <div class="diorama-nav visible" id="dioramaNav">
          <button class="diorama-nav__toggle" id="navToggle" type="button" title="Locations">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <circle cx="8" cy="4" r="2" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 6v4M4 14l4-4 4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="diorama-nav__panel" id="navPanel">
            <div class="diorama-nav__section">
              <div class="diorama-nav__heading">Camera</div>
              <button class="diorama-nav__item" data-cam="overview">Overview</button>
              <button class="diorama-nav__item" data-cam="island">Main Island</button>
              <button class="diorama-nav__item" data-cam="plaza">Plaza</button>
            </div>
            <div class="diorama-nav__section">
              <div class="diorama-nav__heading">Districts</div>
              <button class="diorama-nav__item" data-loc="analysis">Analysis</button>
              <button class="diorama-nav__item" data-loc="literature">Literature</button>
              <button class="diorama-nav__item" data-loc="hypothesis">Hypothesis</button>
              <button class="diorama-nav__item" data-loc="design">Design</button>
            </div>
            <div class="diorama-nav__section">
              <div class="diorama-nav__heading">Islands</div>
              <button class="diorama-nav__item" data-loc="catalina">Catalina Island</button>
              <button class="diorama-nav__item" data-loc="aegean">Aegean Isle</button>
              <button class="diorama-nav__item" data-loc="desert">Desert Outpost</button>
              <button class="diorama-nav__item" data-loc="hawaii">Hawaiian Isle</button>
              <button class="diorama-nav__item" data-loc="jeju">Jeju Island</button>
              <button class="diorama-nav__item" data-loc="treasure">Treasure Island</button>
              <button class="diorama-nav__item" data-loc="maldives">Maldives Resort</button>
              <button class="diorama-nav__item" data-loc="hermit">Hermit's Isle</button>
              <button class="diorama-nav__item" data-loc="glacier">Glacier Island</button>
              <button class="diorama-nav__item" data-loc="montsaintmichel">Mont-Saint-Michel</button>
              <button class="diorama-nav__item" data-loc="cherryblossom">Cherry Blossom Island</button>
              <button class="diorama-nav__item" data-loc="skyisland">Sky Island</button>
              <button class="diorama-nav__item" data-loc="cinqueterre">Cinque Terre</button>
              <button class="diorama-nav__item" data-loc="bamboo">Korean Island</button>
              <button class="diorama-nav__item" data-loc="borabora">Bora Bora</button>
            </div>
            <div class="diorama-nav__section">
              <div class="diorama-nav__heading">Bora Bora Directory</div>
              <button class="diorama-nav__item" data-loc="bb_bungalows">Overwater Bungalows</button>
              <button class="diorama-nav__item" data-loc="bb_otemanu">Mount Otemanu</button>
              <button class="diorama-nav__item" data-loc="bb_beach">White Sand Beach</button>
              <button class="diorama-nav__item" data-loc="bb_lagoon">Turquoise Lagoon</button>
              <button class="diorama-nav__item" data-loc="bb_pool">Resort Pool</button>
            </div>
            <div class="diorama-nav__section">
              <div class="diorama-nav__heading">Landmarks</div>
              <button class="diorama-nav__item" data-loc="lighthouse">Lighthouse</button>
              <button class="diorama-nav__item" data-loc="farm">Farm</button>
              <button class="diorama-nav__item" data-loc="bonfire">Bonfire</button>
            </div>
          </div>
        </div>
        <div class="diorama-hint" id="dioramaHint">
          <span>Drag to look · Scroll to zoom · Click to interact</span>
        </div>
        <div class="diorama-controls visible">
          <button class="diorama-btn" id="dioramaReset" type="button" title="Reset view">&#8962;</button>
          <button class="diorama-btn" id="dioramaSpawn" type="button" title="Add agent">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <circle cx="8" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="diorama-btn" id="symposiumBtn" type="button" title="Call symposium">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <path d="M12 3L6 6H3v4h3l6 3V3z" stroke="currentColor" stroke-width="1.3"/>
              <path d="M14 6.5c.8.5.8 2.5 0 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="diorama-btn" id="sunsetBtn" type="button" title="Toggle sunset">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="diorama-btn" id="dawnBtn" type="button" title="Toggle dawn / winter">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <path d="M8 1l.7 2.1L11 2l-1.1 2.3L12 5h-2.3L11 7l-2.1-.7L8 9l-.9-2.7L5 7l1.3-1H4l2.1-1.7L5 2l2.3 1.1z" stroke="currentColor" stroke-width="1" stroke-linejoin="round" fill="none"/>
              <path d="M3 11c1.5-1 3.5-1 5 0s3.5 1 5 0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M2 14c1.5-1 3.5-1 5 0s3.5 1 5 0" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="diorama-btn active" id="muteAgentsBtn" type="button" title="Mute agents">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <path d="M2 6h2.5L8 3v10L4.5 10H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              <path d="M11 5.5l4 5M15 5.5l-4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <script>
      const t = document.getElementById("themeToggle");
      if (t) t.addEventListener("click", () => {
        const c = document.documentElement.dataset.theme;
        const n = c === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = n;
        localStorage.setItem("theme", n);
      });
    </script>
  </body>
</html>
